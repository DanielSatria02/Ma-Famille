name: patch-edge

# One-off: make the shared edge proxy pass a websocket through, so the
# payment page can be told the moment a booking settles.
on:
  workflow_dispatch:

env:
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || 'be-ssh.rzidinc.com' }}
  DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o /tmp/cloudflared.deb
          sudo dpkg -i /tmp/cloudflared.deb

      - name: Write SSH config
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '#!/bin/sh\nexec cloudflared access ssh --hostname "$1" --service-token-id "$TUNNEL_SERVICE_TOKEN_ID" --service-token-secret "$TUNNEL_SERVICE_TOKEN_SECRET"\n' > ~/cfssh
          chmod +x ~/cfssh
          printf 'Host prod\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy\n  StrictHostKeyChecking accept-new\n  ProxyCommand ~/cfssh %%h\n' "$DEPLOY_HOST" "$DEPLOY_USER" > ~/.ssh/config

      - name: Patch the edge and check the handshake
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          scp scripts/patch_edge_websocket.py scripts/patch-edge-websocket.sh prod:/tmp/
          ssh prod "sh -s" <<'EOF'
          set -e
          mkdir -p ~/scripts
          cp /tmp/patch_edge_websocket.py /tmp/patch-edge-websocket.sh ~/scripts/
          sh ~/scripts/patch-edge-websocket.sh /home/deploy/edge/nginx.conf
          rm -f /tmp/patch_edge_websocket.py /tmp/patch-edge-websocket.sh
          echo
          echo "=== the handshake through the edge now ==="
          python3 - <<'PY'
          import socket

          path = "/ma-famille/v1/ws/bookings/01a160b4-e6e0-7c12-a6ed-b3493602dccc"
          lines = [
              f"GET {path} HTTP/1.1",
              "Host: college-api.rzidinc.com",
              "Connection: Upgrade",
              "Upgrade: websocket",
              "Sec-WebSocket-Version: 13",
              "Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==",
          ]
          sock = socket.create_connection(("127.0.0.1", 80), timeout=10)
          sock.sendall(("\r\n".join(lines) + "\r\n\r\n").encode())
          data = sock.recv(4096)
          sock.close()
          print(data.decode(errors="replace").split("\r\n")[0])
          PY
          echo
          echo "=== the api still answers normally ==="
          curl -s -o /dev/null -m 10 -w 'health -> %{http_code}\n' \
            -H 'Host: college-api.rzidinc.com' 'http://127.0.0.1/ma-famille/v1/health'
          EOF
