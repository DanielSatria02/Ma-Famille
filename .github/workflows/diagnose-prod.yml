name: diagnose-prod

# Temporary: look at the prod server's networking from the inside.
on:
  workflow_dispatch:

env:
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || 'be-ssh.rzidinc.com' }}
  DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o /tmp/cloudflared.deb
          sudo dpkg -i /tmp/cloudflared.deb

      - name: Write SSH config
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '#!/bin/sh\nexec cloudflared access ssh --hostname "$1" --service-token-id "$TUNNEL_SERVICE_TOKEN_ID" --service-token-secret "$TUNNEL_SERVICE_TOKEN_SECRET"\n' > ~/cfssh
          chmod +x ~/cfssh
          printf 'Host prod\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy\n  StrictHostKeyChecking accept-new\n  ProxyCommand ~/cfssh %%h\n' "$DEPLOY_HOST" "$DEPLOY_USER" > ~/.ssh/config

      - name: Look at the server
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          ssh prod "sh -s" <<'EOF'
          echo "=== the host resolv.conf ==="
          cat /etc/resolv.conf
          echo
          echo "=== the host resolves doku? ==="
          getent hosts api-sandbox.doku.com || echo "HOST_CANNOT_RESOLVE_DOKU"
          echo
          echo "=== the host reaches doku? ==="
          curl -s -m 15 -o /dev/null -w 'host https -> %{http_code}\n' https://api-sandbox.doku.com/ || echo "HOST_CURL_FAILED"
          echo
          echo "=== the api container's resolv.conf ==="
          podman exec ma-famille-api-1 cat /etc/resolv.conf 2>/dev/null || podman ps --format '{{.Names}}'
          echo
          echo "=== the api container resolves doku? ==="
          podman exec ma-famille-api-1 python -c "import socket; print(socket.gethostbyname('api-sandbox.doku.com'))" 2>&1 | tail -3
          echo
          echo "=== the api container reaches doku? ==="
          podman exec ma-famille-api-1 python -c "
          import httpx
          try:
              print('container https ->', httpx.get('https://api-sandbox.doku.com/', timeout=10).status_code)
          except Exception as e:
              print('container FAILED:', type(e).__name__, e)
          " 2>&1 | tail -3
          echo
          echo "=== the api container reaches the database? ==="
          podman exec ma-famille-api-1 python -c "
          import socket
          print(socket.gethostbyname('10.10.0.10'))
          " 2>&1 | tail -2
          echo
          echo "=== does the host have pg_dump? ==="
          command -v pg_dump || echo "no pg_dump on the host"
          echo
          echo "=== the DATABASE_URL shape (password hidden) ==="
          grep '^DATABASE_URL=' /home/deploy/ma-famille/backend/.env | sed -E 's#://[^:]+:[^@]+@#://user:…@#'
          EOF
