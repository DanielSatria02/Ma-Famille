name: diagnose-prod

# Temporary: look at the prod server's networking from the inside.
on:
  workflow_dispatch:

env:
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || 'be-ssh.rzidinc.com' }}
  DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o /tmp/cloudflared.deb
          sudo dpkg -i /tmp/cloudflared.deb

      - name: Write SSH config
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '#!/bin/sh\nexec cloudflared access ssh --hostname "$1" --service-token-id "$TUNNEL_SERVICE_TOKEN_ID" --service-token-secret "$TUNNEL_SERVICE_TOKEN_SECRET"\n' > ~/cfssh
          chmod +x ~/cfssh
          printf 'Host prod\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy\n  StrictHostKeyChecking accept-new\n  ProxyCommand ~/cfssh %%h\n' "$DEPLOY_HOST" "$DEPLOY_USER" > ~/.ssh/config

      - name: Look at the server
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          ssh prod "sh -s" <<'EOF'
          echo "=== who listens on port 80 ==="
          (ss -ltnp 2>/dev/null || netstat -ltnp 2>/dev/null) | grep -E ':80\b' || echo 'no ss/netstat'
          echo
          echo "=== the edge container's ports ==="
          podman port ma-famille_edge_1 2>&1
          echo
          echo "=== is there a host nginx too? ==="
          pgrep -a nginx 2>&1 | head -10 || echo 'no host nginx process'
          echo
          echo "=== the config the container actually has now ==="
          podman exec ma-famille_edge_1 sh -c 'sed -n "1,25p" /etc/nginx/conf.d/default.conf' 2>&1
          echo
          echo "=== the map directive inside the container ==="
          podman exec ma-famille_edge_1 sh -c 'grep -n "map\|Upgrade" /etc/nginx/conf.d/default.conf' 2>&1
          echo
          echo "=== nginx -T from the container: is the map there? ==="
          podman exec ma-famille_edge_1 nginx -T 2>&1 | grep -n 'maf_connection_upgrade\|Upgrade' | head -10
          echo
          echo "=== the handshake, again, on the host port 80 ==="
          python3 - <<'PY'
          import socket

          path = "/ma-famille/v1/ws/bookings/01a160b4-e6e0-7c12-a6ed-b3493602dccc"
          lines = [
              f"GET {path} HTTP/1.1",
              "Host: college-api.rzidinc.com",
              "Connection: Upgrade",
              "Upgrade: websocket",
              "Sec-WebSocket-Version: 13",
              "Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==",
          ]
          sock = socket.create_connection(("127.0.0.1", 80), timeout=10)
          sock.sendall(("\r\n".join(lines) + "\r\n\r\n").encode())
          data = sock.recv(4096)
          sock.close()
          print(data.decode(errors="replace").split("\r\n")[0])
          PY
          echo
          echo "=== and straight at the container's own port ==="
          podman exec ma-famille_edge_1 sh -c 'wget -q -O /dev/null --header="Host: college-api.rzidinc.com" http://127.0.0.1/ma-famille/v1/health && echo "container health 200"' 2>&1 | tail -2
          EOF
