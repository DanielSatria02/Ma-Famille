name: diagnose-prod

# Temporary: look at the prod server's networking from the inside.
on:
  workflow_dispatch:

env:
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || 'be-ssh.rzidinc.com' }}
  DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o /tmp/cloudflared.deb
          sudo dpkg -i /tmp/cloudflared.deb

      - name: Write SSH config
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '#!/bin/sh\nexec cloudflared access ssh --hostname "$1" --service-token-id "$TUNNEL_SERVICE_TOKEN_ID" --service-token-secret "$TUNNEL_SERVICE_TOKEN_SECRET"\n' > ~/cfssh
          chmod +x ~/cfssh
          printf 'Host prod\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy\n  StrictHostKeyChecking accept-new\n  ProxyCommand ~/cfssh %%h\n' "$DEPLOY_HOST" "$DEPLOY_USER" > ~/.ssh/config

      - name: Look at the server
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          ssh prod "sh -s" <<'EOF'
          echo "=== the container names ==="
          podman ps --format '{{.Names}}'
          echo
          echo "=== can the host use a public resolver? ==="
          for dns in 1.1.1.1 8.8.8.8 10.10.0.1; do
            printf '%-12s ' "$dns"
            nslookup api-sandbox.doku.com "$dns" 2>&1 | grep -A2 '^Name:' | tr '\n' ' ' | cut -c1-90
            echo
          done
          echo
          echo "=== is the egress blocked, or only the name? ==="
          curl -s -m 12 -o /dev/null -w 'by ip -> %{http_code}\n' \
            --resolve api-sandbox.doku.com:443:147.139.176.73 https://api-sandbox.doku.com/ || echo "BY_IP_FAILED"
          curl -s -m 12 -o /dev/null -w 'github -> %{http_code}\n' https://github.com/ || echo "GITHUB_FAILED"
          curl -s -m 12 -o /dev/null -w 'google -> %{http_code}\n' https://www.google.com/ || echo "GOOGLE_FAILED"
          echo
          echo "=== the api container: what does it see? ==="
          C=ma-famille_api_1
          podman exec "$C" cat /etc/resolv.conf 2>&1
          echo
          podman exec "$C" python -c "
          import socket, httpx
          try:
              print('default resolve ->', socket.gethostbyname('api-sandbox.doku.com'))
          except Exception as e:
              print('default resolve FAILED:', e)
          for dns in ('1.1.1.1', '8.8.8.8'):
              try:
                  print('resolve via', dns, '->', socket.gethostbyname('api-sandbox.doku.com', dns))
              except Exception as e:
                  print('resolve via', dns, 'FAILED:', e)
          try:
              print('https ->', httpx.get('https://api-sandbox.doku.com/', timeout=10).status_code)
          except Exception as e:
              print('https FAILED:', type(e).__name__, e)
          " 2>&1 | tail -12
          echo
          echo "=== the database still answers? ==="
          podman exec "$C" python -c "
          import socket
          print('db ip ->', socket.gethostbyname('10.10.0.10'))
          " 2>&1 | tail -2
          EOF
