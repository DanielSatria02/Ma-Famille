name: diagnose-prod

# Temporary: look at the prod server's networking from the inside.
on:
  workflow_dispatch:

env:
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || 'be-ssh.rzidinc.com' }}
  DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o /tmp/cloudflared.deb
          sudo dpkg -i /tmp/cloudflared.deb

      - name: Write SSH config
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '#!/bin/sh\nexec cloudflared access ssh --hostname "$1" --service-token-id "$TUNNEL_SERVICE_TOKEN_ID" --service-token-secret "$TUNNEL_SERVICE_TOKEN_SECRET"\n' > ~/cfssh
          chmod +x ~/cfssh
          printf 'Host prod\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy\n  StrictHostKeyChecking accept-new\n  ProxyCommand ~/cfssh %%h\n' "$DEPLOY_HOST" "$DEPLOY_USER" > ~/.ssh/config

      - name: Look at the server
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          ssh prod "sh -s" <<'EOF'
          echo "=== the containers ==="
          podman ps --format '{{.Names}} {{.Image}} {{.Status}}'
          echo
          echo "=== the edge nginx config ==="
          podman exec ma-famille_edge_1 sh -c 'cat /etc/nginx/conf.d/default.conf 2>/dev/null || cat /etc/nginx/nginx.conf' 2>&1
          echo
          echo "=== the api container: is the websocket route there? ==="
          podman exec ma-famille_api_1 python -c "
          from app.main import app
          for r in app.routes:
              p = getattr(r, 'path', '')
              if 'ws' in p:
                  print('  ', type(r).__name__, p)
          " 2>&1 | tail -5
          echo
          echo "=== the api container logs: the 404 ==="
          podman logs ma-famille_api_1 2>&1 | grep -i 'ws/bookings\|404' | tail -8
          echo
          echo "=== a websocket handshake straight at the api container ==="
          podman exec ma-famille_api_1 python - <<'PY' 2>&1 | tail -8
          import socket

          # The raw upgrade handshake, so the answer is the server's own.
          request = (
              "GET /ma-famille/v1/ws/bookings/01a160b4-e6e0-7c12-a6ed-b3493602dccc HTTP/1.1\r\n"
              "Host: localhost\r\n"
              "Connection: Upgrade\r\n"
              "Upgrade: websocket\r\n"
              "Sec-WebSocket-Version: 13\r\n"
              "Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==\r\n"
              "\r\n"
          )
          sock = socket.create_connection(("127.0.0.1", 8000), timeout=10)
          sock.sendall(request.encode())
          data = sock.recv(4096)
          sock.close()
          print(data.decode(errors="replace")[:400])
          PY
          echo
          echo "=== and through the edge, on the host ==="
          python3 - <<'PY' 2>&1 | tail -8
          import socket

          request = (
              "GET /ma-famille/v1/ws/bookings/01a160b4-e6e0-7c12-a6ed-b3493602dccc HTTP/1.1\r\n"
              "Host: localhost\r\n"
              "Connection: Upgrade\r\n"
              "Upgrade: websocket\r\n"
              "Sec-WebSocket-Version: 13\r\n"
              "Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==\r\n"
              "\r\n"
          )
          sock = socket.create_connection(("127.0.0.1", 8080), timeout=10)
          sock.sendall(request.encode())
          data = sock.recv(4096)
          sock.close()
          print(data.decode(errors="replace")[:400])
          PY
          EOF
