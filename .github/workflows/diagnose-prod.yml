name: diagnose-prod

# Temporary: look at the prod server's networking from the inside.
on:
  workflow_dispatch:

env:
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || 'be-ssh.rzidinc.com' }}
  DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o /tmp/cloudflared.deb
          sudo dpkg -i /tmp/cloudflared.deb

      - name: Write SSH config
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '#!/bin/sh\nexec cloudflared access ssh --hostname "$1" --service-token-id "$TUNNEL_SERVICE_TOKEN_ID" --service-token-secret "$TUNNEL_SERVICE_TOKEN_SECRET"\n' > ~/cfssh
          chmod +x ~/cfssh
          printf 'Host prod\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy\n  StrictHostKeyChecking accept-new\n  ProxyCommand ~/cfssh %%h\n' "$DEPLOY_HOST" "$DEPLOY_USER" > ~/.ssh/config

      - name: Look at the server
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          ssh prod "sh -s" <<'EOF'
          echo "=== the route and the gateway ==="
          ip route 2>/dev/null | head -5
          echo
          echo "=== tcp 53 to the usual resolvers ==="
          for dns in 10.10.0.1 1.1.1.1 8.8.8.8 9.9.9.9; do
            if timeout 4 bash -c "cat < /dev/null > /dev/tcp/$dns/53" 2>/dev/null; then
              echo "$dns:53 tcp -> open"
            else
              echo "$dns:53 tcp -> blocked"
            fi
          done
          echo
          echo "=== does the gateway answer dns? ==="
          GW=$(ip route 2>/dev/null | awk '/default/{print $3; exit}')
          echo "gateway: $GW"
          if [ -n "$GW" ]; then
            getent hosts google.com >/dev/null 2>&1 && echo "the gateway resolves" || echo "the gateway does not resolve"
            nslookup google.com "$GW" 2>&1 | tail -4
          fi
          echo
          echo "=== dns over https from the host (no name needed, it is an ip) ==="
          curl -s -m 15 -H 'accept: application/dns-json' \
            'https://1.1.1.1/dns-query?name=api-sandbox.doku.com&type=A' | head -c 400
          echo
          echo
          echo "=== and through the tunnel container? ==="
          podman exec ma-famille_edge_1 sh -c \
            "wget -q -O - --header='accept: application/dns-json' 'https://1.1.1.1/dns-query?name=api-sandbox.doku.com&type=A' 2>&1 | head -c 300" 2>&1 | tail -3
          echo
          echo "=== the scan of the lan for a resolver that answers ==="
          python3 - <<'PY' 2>&1 | tail -20
          import socket, struct

          def ask(server, name="google.com", timeout=1.5):
              header = struct.pack("!HHHHHH", 0x4321, 0x0100, 1, 0, 0, 0)
              body = b""
              for part in name.split("."):
                  body += bytes([len(part)]) + part.encode()
              body += b"\x00" + struct.pack("!HH", 1, 1)
              s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
              s.settimeout(timeout)
              try:
                  s.sendto(header + body, (server, 53))
                  data, _ = s.recvfrom(2048)
              except Exception:
                  return None
              finally:
                  s.close()
              if data[3] & 0x0F == 0 and struct.unpack("!H", data[6:8])[0]:
                  return True
              return False

          found = []
          for last in range(1, 60):
              server = f"10.10.0.{last}"
              if ask(server):
                  found.append(server)
                  print(server, "answers")
          print("resolvers on the lan:", found or "none")
          PY
          echo
          echo "=== the podman dns the container uses ==="
          podman exec ma-famille_api_1 cat /etc/resolv.conf 2>&1
          echo
          echo "=== can the container reach 1.1.1.1 on 443? ==="
          podman exec ma-famille_api_1 python -c "
          import httpx
          try:
              r = httpx.get('https://1.1.1.1/', timeout=10)
              print('1.1.1.1 https ->', r.status_code)
          except Exception as e:
              print('1.1.1.1 https FAILED:', type(e).__name__, e)
          " 2>&1 | tail -2
          EOF
