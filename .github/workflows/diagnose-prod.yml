name: diagnose-prod

# Temporary: look at the prod server's networking from the inside.
on:
  workflow_dispatch:

env:
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || 'be-ssh.rzidinc.com' }}
  DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o /tmp/cloudflared.deb
          sudo dpkg -i /tmp/cloudflared.deb

      - name: Write SSH config
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '#!/bin/sh\nexec cloudflared access ssh --hostname "$1" --service-token-id "$TUNNEL_SERVICE_TOKEN_ID" --service-token-secret "$TUNNEL_SERVICE_TOKEN_SECRET"\n' > ~/cfssh
          chmod +x ~/cfssh
          printf 'Host prod\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy\n  StrictHostKeyChecking accept-new\n  ProxyCommand ~/cfssh %%h\n' "$DEPLOY_HOST" "$DEPLOY_USER" > ~/.ssh/config

      - name: Look at the server
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          ssh prod "sh -s" <<'EOF'
          echo "=== can the deploy user write the resolver? ==="
          sudo -n true 2>&1 && echo "SUDO_OK" || echo "NO_PASSWORDLESS_SUDO"
          ls -l /etc/resolv.conf
          echo
          echo "=== the lan resolvers: what do they answer for doku? ==="
          for dns in 10.10.0.3 10.10.0.51; do
            echo "--- $dns ---"
            nslookup api-sandbox.doku.com "$dns" 2>&1 | tail -6
          done
          echo
          echo "=== and do they answer for a random name? ==="
          nslookup example.com 10.10.0.3 2>&1 | tail -4
          echo
          echo "=== what is 10.10.0.3 and 10.10.0.51? ==="
          for ip in 10.10.0.3 10.10.0.51; do
            printf '%-14s ' "$ip"
            timeout 3 bash -c "cat < /dev/null > /dev/tcp/$ip/53" 2>/dev/null && echo "dns port open" || echo "dns port closed"
          done
          echo
          echo "=== the host resolver config ==="
          cat /etc/resolv.conf
          echo
          echo "=== can we write it? ==="
          if [ -w /etc/resolv.conf ]; then echo "WRITABLE"; else echo "NOT_WRITABLE"; fi
          echo
          echo "=== the network manager? ==="
          ls /etc/NetworkManager 2>/dev/null && echo "has NetworkManager"
          command -v nmcli >/dev/null && nmcli -t -f NAME,DEVICE con show 2>/dev/null | head -5
          echo
          echo "=== the podman network the api uses ==="
          podman inspect ma-famille_api_1 --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} ip={{$v.IPAddress}} dns={{$v.DNS}}{{end}}' 2>&1
          echo
          echo "=== does podman forward to the host resolver? ==="
          podman exec ma-famille_api_1 cat /etc/resolv.conf 2>&1
          echo
          echo "=== what images are on the host (for the backup) ==="
          podman images --format '{{.Repository}}:{{.Tag}}' 2>&1 | head -10
          echo
          echo "=== is there a postgres image to dump with? ==="
          podman images --format '{{.Repository}}:{{.Tag}}' 2>&1 | grep -i postgres || echo "NO_POSTGRES_IMAGE"
          EOF
